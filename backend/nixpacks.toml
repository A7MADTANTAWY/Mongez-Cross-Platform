# Nixpacks configuration for Railway
# Railway deploys the Django backend from the `backend/` directory.
# `$PORT` and `$DATABASE_URL` are injected by Railway automatically.

providers = ["python"]

# Railpack may not have `pip` in PATH — use `python3 -m pip` as a safe fallback.
setup = "apt-get update && apt-get install -y --no-install-recommends libjpeg62-turbo zlib1g curl && rm -rf /var/lib/apt/lists/*"

build = "python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt"

start = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
