<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mongez — قريباً</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(13,57,144,0.03) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(14,178,107,0.03) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 10% 80%, rgba(13,57,144,0.02) 0%, transparent 70%);
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      width: 100%;
      max-width: 440px;
    }

    .logo-box {
      width: 180px;
      height: 180px;
      margin: 0 auto 2rem;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(13,57,144,0.08);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      display: block;
    }

    h1 {
      font-size: 3.8rem;
      font-weight: 900;
      color: #0d3990;
      letter-spacing: 1px;
      line-height: 1;
      margin-bottom: 0.1rem;
    }

    h1 .o {
      color: #0eb269;
    }

    .ar {
      font-size: 2rem;
      font-weight: 700;
      color: #0eb269;
      letter-spacing: 6px;
      margin-bottom: 0.6rem;
    }

    .line {
      width: 40px;
      height: 2.5px;
      background: linear-gradient(90deg, #0d3990, #0eb269);
      border-radius: 2px;
      margin: 0 auto 0.8rem;
    }

    .desc {
      font-size: 0.9rem;
      color: #7a8a9a;
      line-height: 1.8;
      max-width: 300px;
      margin: 0 auto 1.5rem;
    }

    .coming {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.35rem 1.1rem;
      border-radius: 50px;
      background: rgba(14,178,107,0.06);
      color: #0eb269;
      font-weight: 600;
      font-size: 0.78rem;
      margin-bottom: 1.5rem;
    }

    .coming .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0eb269;
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .track {
      width: 140px;
      height: 2px;
      background: #eee;
      border-radius: 2px;
      margin: 0 auto 2rem;
      overflow: hidden;
    }

    .track .fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #0d3990, #0eb269);
      border-radius: 2px;
      animation: move 2.5s ease-in-out infinite;
    }

    @keyframes move {
      0% { width: 15%; margin-left: 0; }
      50% { width: 45%; margin-left: 30%; }
      100% { width: 15%; margin-left: 85%; }
    }

    .btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.5rem 1.1rem;
      border: 1.5px solid #e8eaec;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #0d3990;
      cursor: default;
      transition: border-color 0.2s;
    }

    .btn:hover { border-color: #0d3990; }
    .btn span { font-size: 1rem; }

    .ft {
      color: #ccc;
      font-size: 0.65rem;
      margin-top: 2.5rem;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.5rem; }
      .ar { font-size: 1.5rem; letter-spacing: 4px; }
      .logo-box { width: 150px; height: 150px; border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="container">
    <div class="logo-box">
      <img src="logo.png" alt="Mongez" onerror="this.src='logo.jpg'">
    </div>

    <h1>M<span class="o">o</span>ngez</h1>
    <div class="ar">مـنـجـز</div>

    <div class="line"></div>

    <div class="desc">
      منصة متكاملة للخدمات بين العميل ومقدم الخدمة بثقة وأمان
    </div>

    <div class="coming">
      <span class="dot"></span>
      قريباً
    </div>

    <div class="track">
      <div class="fill"></div>
    </div>

    <div class="btns">
      <div class="btn"><span>🍎</span> App Store</div>
      <div class="btn"><span>▶️</span> Google Play</div>
    </div>

    <div class="ft">© 2026 Mongez. All rights reserved.</div>
  </div>
</body>
</html>
