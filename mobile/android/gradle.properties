# زوّد الذاكرة لـ Gradle لتجنب كراش JVM
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# استخدام AndroidX
android.useAndroidX=true

# عرض ملخص الـ warnings فقط بدل طباعتها كلها في الكونسول
org.gradle.warning.mode=summary

# لو عايز تقلل Tree-shaking للأيقونات
# flutter build apk --release --no-tree-shake-icons
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
